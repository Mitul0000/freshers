version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: incognito_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-freshers_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin_password_123}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-freshers_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: incognito_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-freshers_db}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_password_123}
      JWT_SECRET: ${JWT_SECRET:-super_secret_incognito_godfather_key_2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-corleone_admin_2026}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-incognito.scsdf.events@gmail.com}
    volumes:
      - .:/app

volumes:
  postgres_data:
